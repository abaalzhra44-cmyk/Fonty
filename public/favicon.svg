<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Glossy Overlay Gradient -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.4" />
    </filter>

    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#030712" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Inner Border Highlights -->
  <rect x="34" y="34" width="444" height="444" rx="110" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.3" />
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#glossGrad)" />

  <!-- Vector Calligraphy Pen Nib & Arabic Letter Dād (ض) Symbol -->
  <g filter="url(#glyphShadow)">
    <!-- Pen Nib Outline & Stylized Glyph -->
    <path d="M 256,110 L 310,195 L 310,250 C 310,280 286,305 256,305 C 226,305 202,280 202,250 L 202,195 Z" fill="#ffffff" />
    
    <!-- Pen Nib Slit -->
    <line x1="256" y1="110" x2="256" y2="230" stroke="#0284c7" stroke-width="12" stroke-linecap="round" />
    <circle cx="256" cy="230" r="14" fill="#0284c7" />

    <!-- Elegant Calligraphic Arabic Loop (الضاد / الخط العربي) -->
    <path d="M 150,340 C 150,290 210,280 280,280 C 350,280 390,320 390,360 C 390,410 320,425 240,425 C 170,425 130,395 130,360 C 130,340 145,325 170,325 C 210,325 240,365 290,365 C 330,365 350,350 350,335 C 350,315 320,305 275,305 C 215,305 180,315 150,340 Z" fill="#ffffff" />

    <!-- Diacritic Nuqta / Sparkle Dot (نقطة الضاد الفاخرة) -->
    <circle cx="340" cy="140" r="28" fill="url(#goldGrad)" />
    <path d="M 340,115 L 345,135 L 365,140 L 345,145 L 340,165 L 335,145 L 315,140 L 335,135 Z" fill="#ffffff" />
  </g>

  <!-- Vector Anchor Point Handles (Reflecting Vector Font Design Studio) -->
  <circle cx="202" cy="195" r="8" fill="#5ac8ff" stroke="#ffffff" stroke-width="3" />
  <circle cx="310" cy="195" r="8" fill="#5ac8ff" stroke="#ffffff" stroke-width="3" />
  <rect x="248" y="417" width="16" height="16" rx="3" fill="#5ac8ff" stroke="#ffffff" stroke-width="3" />
</svg>
